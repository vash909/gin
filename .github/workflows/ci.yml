name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: portable (${{ matrix.os }}, ${{ matrix.cc }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: gcc
          - os: ubuntu-24.04
            cc: clang
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install REST/TLS development dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libjansson-dev pkg-config openssl
      - name: Build native WebSocket curl
        env:
          TMPDIR: ${{ runner.temp }}
          GIN_CURL_PREFIX: ${{ runner.temp }}/gin-curl
        run: |
          sh scripts/build-host-curl.sh
          echo "CURL_CONFIG=$GIN_CURL_PREFIX/bin/curl-config" >> "$GITHUB_ENV"
      - name: Build and test strict C99/POSIX
        env:
          CC: ${{ matrix.cc }}
        run: make CC="$CC" CURL_CONFIG="${CURL_CONFIG:-curl-config}" check
      - name: Verify staged installation behavior
        run: python3 tests/test_install.py make
      - name: Verify staged install and uninstall
        run: |
          make DESTDIR="$PWD/.build/stage" PREFIX=/usr install
          .build/stage/usr/bin/gin --version
          make DESTDIR="$PWD/.build/stage" PREFIX=/usr uninstall
          test ! -e .build/stage/usr/bin/gin
          test ! -e .build/stage/usr/share/man/man1/gin.1

  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install developer tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools bmake cmake curl xz-utils bzip2 libcurl4-openssl-dev libjansson-dev pkg-config openssl
      - name: Build pinned musl TLS dependencies
        env:
          GIN_MUSL_PREFIX: ${{ runner.temp }}/gin-musl
          TMPDIR: ${{ runner.temp }}
        run: sh scripts/build-musl-http.sh
      - name: musl libc and actual musl TLS libcurl
        run: make CC=musl-gcc CURL_CONFIG="$RUNNER_TEMP/gin-musl/bin/curl-config" JANSSON_CFLAGS="-I$RUNNER_TEMP/gin-musl/include" JANSSON_LIBS="-L$RUNNER_TEMP/gin-musl/lib -ljansson" LDFLAGS=-static check
      - name: Build native WebSocket curl
        env:
          TMPDIR: ${{ runner.temp }}
          GIN_CURL_PREFIX: ${{ runner.temp }}/gin-curl
        run: |
          sh scripts/build-host-curl.sh
          echo "CURL_CONFIG=$GIN_CURL_PREFIX/bin/curl-config" >> "$GITHUB_ENV"
      - name: BSD make
        run: make clean && bmake CC=cc CURL_CONFIG="$CURL_CONFIG" check
      - name: Assertions remain active with NDEBUG
        run: make clean && make CC=gcc CURL_CONFIG="$CURL_CONFIG" CFLAGS='-O2 -DNDEBUG' check

  freebsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: FreeBSD C99/POSIX tests
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          release: '14.3'
          usesh: true
          prepare: pkg install -y python3 curl jansson pkgconf openssl
          run: |
            native_curl_root=$(mktemp -d "${TMPDIR:-/tmp}/gin-native-curl.XXXXXXXXXX")
            export TMPDIR="$native_curl_root/build"
            export GIN_CURL_PREFIX="$native_curl_root/prefix"
            mkdir -p "$TMPDIR"
            sh scripts/build-host-curl.sh
            export CURL_CONFIG="$GIN_CURL_PREFIX/bin/curl-config"
            make CC=cc CURL_CONFIG="$CURL_CONFIG" CURL_LIBS="$("$CURL_CONFIG" --static-libs)" check
            make DESTDIR="$PWD/.build/stage" PREFIX=/usr install
            .build/stage/usr/bin/gin --version
            make DESTDIR="$PWD/.build/stage" PREFIX=/usr uninstall
            test ! -e .build/stage/usr/bin/gin
            test ! -e .build/stage/usr/share/man/man1/gin.1

  analysis:
    runs-on: ubuntu-24.04
    # The full instrumented suite exceeded 20 minutes while still progressing.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install analysis tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cppcheck shellcheck valgrind libcurl4-openssl-dev libjansson-dev pkg-config openssl
      - name: Build native WebSocket curl
        env:
          TMPDIR: ${{ runner.temp }}
          GIN_CURL_PREFIX: ${{ runner.temp }}/gin-curl
        run: |
          sh scripts/build-host-curl.sh
          echo "CURL_CONFIG=$GIN_CURL_PREFIX/bin/curl-config" >> "$GITHUB_ENV"
      - name: Documentation and script checks
        run: |
          python3 scripts/check_docs.py
          shellcheck scripts/*.sh
          git diff --check
      - name: C static analysis
        run: |
          # Keep the version guard active when system headers are not discovered.
          curl_vernum=$("$CURL_CONFIG" --vernum)
          jansson_verhex=$(pkg-config --modversion jansson | python3 -c 'import sys; p=[int(x) for x in sys.stdin.read().strip().split(".")]; print(hex((p[0]<<16)|(p[1]<<8)|(p[2] if len(p)>2 else 0)))')
          cppcheck --force "-DLIBCURL_VERSION_NUM=0x$curl_vernum" "-DJANSSON_VERSION_HEX=$jansson_verhex" --std=c99 --enable=warning,performance,portability --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem -I include src
      - name: ASan and UBSan
        run: make CC=gcc CURL_CONFIG="$CURL_CONFIG" CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie' LDFLAGS='-fsanitize=address,undefined -no-pie' check
      - name: Valgrind
        run: |
          make clean
          make CC=gcc CURL_CONFIG="$CURL_CONFIG" check
          sudo env TMPDIR="$PWD/.build/root-tests" python3 tests/test_cli.py
          sudo env TMPDIR="$PWD/.build/root-tests" python3 tests/test_locking.py
          sudo env TMPDIR="$PWD/.build/root-tests" python3 tests/test_input.py
          sudo env TMPDIR="$PWD/.build/root-tests" python3 tests/test_runtime.py
          sudo env TMPDIR="$PWD/.build/root-tests" python3 tests/test_session_permissions.py
          sudo env TMPDIR="$PWD/.build/root-tests" python3 tests/test_credentials.py
          GIN_RUNTIME_PREFIX='valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all' python3 tests/test_runtime.py
          GIN_HTTP_PREFIX='valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all' python3 tests/test_http.py HTTPTests.test_tls_trust_and_hostname
          GIN_AUTH_PREFIX='valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all' python3 tests/test_auth.py AuthTests.test_stateful_revocation_and_explicit_persistence
          GIN_CONNECT_PREFIX='valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all' python3 tests/test_connect.py
          GIN_LIVENESS_PREFIX='valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all' python3 tests/test_liveness.py
          GIN_RENDER_PREFIX='valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all' python3 tests/test_render.py
          sudo env TMPDIR="$PWD/.build/root-tests" .build/test_render_output
          GIN_SEND_PREFIX='valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all' python3 tests/test_send.py
          GIN_CONTROL_PREFIX='valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all' python3 tests/test_control.py
          GIN_QUERY_PREFIX='valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all' python3 tests/test_query.py
          GIN_HISTORY_PREFIX='valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all' python3 tests/test_history_http.py
          GIN_HISTORY_PREFIX='valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all' python3 tests/test_history.py
          GIN_SESSION_PREFIX='valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all' python3 tests/test_session.py
          GIN_SESSION_PREFIX='valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all' python3 tests/test_session_failures.py
          GIN_SESSION_PREFIX='valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all' python3 tests/test_session_backlog.py
          GIN_SESSION_PREFIX='valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all' python3 tests/test_session_reception.py
          GIN_SESSION_PREFIX='valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all' python3 tests/test_session_outbound.py
          GIN_SESSION_PREFIX='valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all' python3 tests/test_session_operations.py
          GIN_SESSION_PREFIX='valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all' python3 tests/test_session_controls.py
          GIN_SESSION_PREFIX='valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all' python3 tests/test_session_query.py
          GIN_SESSION_BINARY=.build/gin_receive_observer GIN_SESSION_PREFIX='valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all' python3 tests/test_session_admission.py
          GIN_SESSION_BINARY=.build/gin_owner_fault GIN_SESSION_PREFIX='valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all' python3 tests/test_session_owner_faults.py
          valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all .build/test_live_json_fidelity render
          sudo env TMPDIR="$PWD/.build/root-tests" python3 tests/test_control.py ControlTests.test_local_rejections_before_discovery
          for unit in test_session_operation test_session_topology_fidelity test_session_live_queue test_session_live_queue_owned test_session_clock test_live_json_fidelity test_connect_drain test_session_config test_session_owner test_session_owner_whitebox test_history_page test_history_owned test_history_live test_history_recovery test_history_path test_history_evidence test_render_plain test_liveness_backoff test_connect_liveness test_command test_control test_connect_query test_send test_send_payload test_send_reply test_render test_render_escape test_render_time test_render_output test_connect test_connect_protocols test_connect_topic test_phoenix test_phoenix_stream test_phoenix_collect test_phoenix_refs; do
            valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all ".build/$unit"
          done
          for unit in test_authority_json_config test_authority_json_identity test_authority_json_store; do
              for mode in mutation sweep; do
                  valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all ".build/$unit" "$mode"
              done
          done
          for mode in ack-mutation ack-sweep ack-null severance-mutation severance-code-mutation severance-null severance-sweep; do
              valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all .build/test_authority_json_connect "$mode"
          done
          valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all .build/test_topology
          valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all .build/test_topology_lookup
          GIN_TOPOLOGY_PREFIX='valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all' python3 tests/test_topology.py
          valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all .build/test_protocol_parse
          GIN_PROTOCOL_PREFIX='valgrind --quiet --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=all' python3 tests/test_protocol.py ProtocolTests.test_gated_login_order ProtocolTests.test_resume_and_fresh_preflight_each_call ProtocolTests.test_auth_failures_preserve_phase_and_clear_output
          valgrind --quiet --error-exitcode=1 --leak-check=full --errors-for-leak-kinds=all .build/gin init -d "$PWD/.build/valgrind-root" -n azzurra -c '#grappa'

  gate:
    name: gate
    if: always()
    needs: [portable, compatibility, freebsd, analysis]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every prerequisite to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failures = {name: value['result'] for name, value in results.items() if value['result'] != 'success'}
          if failures:
              raise SystemExit(f'Required CI jobs did not all succeed: {failures}')
          print('All required platform and analysis jobs passed.')
          PY

  source:
    name: source snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create source archive and checksum
        run: |
          mkdir -p dist
          git archive --format=tar --prefix="gin-${GITHUB_SHA}/" HEAD | gzip -n > "dist/gin-${GITHUB_SHA}.tar.gz"
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gin-source-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
